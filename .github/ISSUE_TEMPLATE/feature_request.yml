name: Feature request
description: Suggest a user workflow or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior and examples
      description: Include relevant formats and alternatives considered.
    validations:
      required: true
