name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach private files, secrets, or exploit payloads. See SECURITY.md for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: App version and Windows version
      placeholder: 0.1.0, Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the tool/format, file count, and whether the wheel or main window was used.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant environment
      description: FFmpeg / Office versions, DPI/monitor setup, and sanitized error text if relevant.
